# NOT pyproject.toml: when Vercel sees a pyproject at the root it switches to
# uv mode and, finding no [project] table inside, fails the build with
# "No project table found". Two deployments broke that way. Tool settings
# live in files that do not trigger uv; dependencies stay in requirements.txt.
[pytest]
# Both suites, because CI runs a bare `pytest` and takes this as the whole
# truth: for a while the checks/ tests passed locally and never ran in the
# build. A test the build does not run is not a test.
testpaths = tests checks
pythonpath = .
addopts = -q
filterwarnings = ignore::DeprecationWarning
