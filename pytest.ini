# pyproject.toml DEGIL: Vercel kokte bir pyproject gorurse uv moduna geciyor ve
# icinde [project] tablosu olmadigi icin build'i "No project table found" ile
# dusuruyor. Iki dagitim boyle kirildi. Arac ayarlari uv'yi tetiklemeyen
# dosyalarda duruyor; bagimliliklar requirements.txt'te kaliyor.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings = ignore::DeprecationWarning
