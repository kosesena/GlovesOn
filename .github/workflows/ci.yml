# The proof behind the claims. Runs on every push, and anyone looking at
# the repo sees the result in the badge - this is the difference between
# saying "there are write guarantees" and that sentence being tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The mock S/4HANA keeps its data in Postgres (docs/adr/0005). The tests
    # run against a real database, not a fake one: the CSRF handshake, the
    # movement-type rules and the duplicate guard only mean something there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gloveson_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

    env:
      # NOT the database a deployment uses. conftest refuses to run when the
      # two are the same, because every test drops and rebuilds the schema.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gloveson_test
      TOOL_SHARED_SECRET: ci-secret-not-a-real-one

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser voice contracts
        run: |
          node checks/microphone_start.cjs
          node checks/voice_pause.cjs
          node checks/voice_policy.cjs
          node checks/voice_lifecycle.cjs
          node checks/agent_desktop.cjs
          node checks/voice_suggestions.cjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Audit runtime dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --redact
