# See pytest.ini: configuration deliberately not in pyproject.toml.
# .agents/ is third-party skill code (Higgsfield), not held to our standard.
exclude = [".agents"]
line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI uses Depends/Query/Header as default values
]
