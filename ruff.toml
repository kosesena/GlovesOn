# See pytest.ini: configuration deliberately not in pyproject.toml.
# .agents/ is third-party skill code (Higgsfield), not held to our standard.
#
# tools/ is run by hand, under Blender's bundled Python rather than our venv, to
# generate a binary asset once. Its style is dense on purpose and our import and
# target-version rules do not govern that interpreter. Excluding it is a real
# cost — F and B would have caught a genuine mistake there — accepted because
# the failure mode is a mesh that looks wrong the moment you open it, and
# because a lint gate that blocks the whole repository over a one-off script
# stops the tests from running at all, which is what happened.
exclude = [".agents", "tools"]
line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI uses Depends/Query/Header as default values
]
