<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlovesOn — posted stamp motion (lab)</title>
<!--
  Host page for /stamp-motion.js, the module the app plays when a material document lands.
  Plays it with the film's receipt (document 4937706921, 14 September 2026). The film's
  capture is made from this page: ?rec=1 hides the controls, then the recorder presses Enter.
  Enter or the button plays; Escape or a click skips.
-->
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #f3f3f4; font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: #17181a; }
  button { border: 0; background: #17181a; color: #fff; border-radius: 999px; padding: 12px 24px; font: 600 13px/1 inherit; cursor: pointer; }
  p { font-size: 12px; color: #8b8f96; text-align: center; }
</style>
</head>
<body>
<div id="host"><button id="go">Play the posted stamp</button><p>Enter plays · Escape skips</p></div>
<script src="../stamp-motion.js"></script>
<script>
  const RECEIPT = {
    mblnr: '4937706921', bwart: '501', posted_at: '2026-09-14T13:51:58+03:00',
    matnr: '4711', maktx: 'Hex Bolt M8x40 Zinc Plated', menge: '12', meins: 'EA', bin: 'A-03-02',
    werks: '1000', lgort: '0001', before: 271, after: 283, hold: 2000,
  };
  const play = () => playStampMotion(RECEIPT);
  document.getElementById('go').addEventListener('click', play);
  addEventListener('keydown', e => { if (e.key === 'Enter') play(); });
  if (new URLSearchParams(location.search).has('rec')) document.getElementById('host').style.visibility = 'hidden';
</script>
</body>
</html>
