<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 1120 388" width="1120" height="388" role="img" aria-label="GlovesOn architecture: browser microphone to the AssemblyAI Voice Agent API, which calls the GlovesOn gateway over HTTPS; the gateway speaks OData to S/4HANA and streams the live warehouse screen over SSE.">
