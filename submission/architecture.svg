<text x="415" y="203" fill="#244b35" font-size="13">Session capability</text>
<rect x="600" y="100" width="210" height="155" rx="16" fill="#eef4ed" stroke="#547461" stroke-width="2"/>
<text x="705" y="140" fill="#244b35" font-size="19">GlovesOn gateway</text>
<text x="705" y="177" fill="#244b35" font-size="13">Draft validation + auth</text>
<text x="705" y="203" fill="#244b35" font-size="13">OData client</text>
<rect x="890" y="100" width="210" height="155" rx="16" fill="#eef4ed" stroke="#547461" stroke-width="2"/>
<text x="995" y="140" fill="#244b35" font-size="19">Mock ERP</text>
<text x="995" y="177" fill="#244b35" font-size="13">Demo records in Postgres</text>
<text x="995" y="203" fill="#244b35" font-size="13">No live SAP tenant</text>
<path d="M234 174 H304" stroke="#63796a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="270" y="157" font-size="12" fill="#45513e">WebSocket</text>
<path d="M524 174 H594" stroke="#63796a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="560" y="157" font-size="12" fill="#45513e">HTTPS</text>
<path d="M814 174 H884" stroke="#63796a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="850" y="157" font-size="12" fill="#45513e">OData</text>
<path d="M705 258 V295 H415 V258" fill="none" stroke="#63796a" stroke-width="2" marker-end="url(#a)"/><text x="560" y="320" font-size="14" fill="#45513e">Scoped SSE tool results → browser workspace</text><text x="560" y="360" font-size="14" fill="#45513e">Long-lived credentials stay server-side. Real SAP integration remains unverified.</text></g></svg>