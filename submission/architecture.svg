<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="AssemblyAI exchanges audio and function calls with the browser. The browser calls the gateway, which accesses the mock ERP and returns scoped events.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#63796a"/></marker></defs>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<rect x="20" y="100" width="210" height="155" rx="16" fill="#eef4ed" stroke="#547461" stroke-width="2"/>
<text x="125" y="140" fill="#244b35" font-size="19">AssemblyAI</text>
<text x="125" y="177" fill="#244b35" font-size="13">Speech · reasoning · voice</text>
<text x="125" y="203" fill="#244b35" font-size="13">Client function calls</text>
<rect x="310" y="100" width="210" height="155" rx="16" fill="#eef4ed" stroke="#547461" stroke-width="2"/>
<text x="415" y="140" fill="#244b35" font-size="19">Browser</text>
