<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 1120 388" width="1120" height="388" role="img" aria-label="GlovesOn architecture: the worker speaks to the browser, which streams audio to the AssemblyAI Voice Agent API; the agent's tool call comes back down to the browser, which posts it to the GlovesOn gateway with a session capability. The gateway holds the shared secret, speaks OData to S/4HANA and streams the live warehouse screen back over SSE.">
